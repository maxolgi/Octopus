name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Fast checks on every push / PR.
  #    Rust workspace (engine FFI crate + gui + cli) — the C engine has no
  #    automated test suite (manual scripts in tests/ need a running engine).
  # ---------------------------------------------------------------------------
  check:
    name: Lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build deps (ALSA for the engine, X11/Wayland for egui)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libasound2-dev \
            libxcb1-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxext-dev libxkbcommon-dev libwayland-dev

      # fmt is advisory (pre-existing diffs). clippy shows lints without
      # -D warnings so it doesn't error on intentional patterns.
      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # 2. Full build — Linux, Windows. No macOS: the engine is ALSA/winmm only.
  #    Each entry builds the C engine (standalone binary + static lib) and the
  #    Rust workspace (octopus_gui, octopus_cli — engine hosted in-process,
  #    HTML control surface embedded at compile time).
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            artifact: octopus-linux-x64
          - name: Windows x64
            os: windows-latest
            artifact: octopus-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # The C engine objects are MinGW-built; the Rust binaries link them
      # statically, so the gnu Rust target is required on Windows.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build deps (ALSA + egui X11/Wayland headers)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libasound2-dev \
            libxcb1-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxext-dev libxkbcommon-dev libwayland-dev

      # ----- C engine (standalone) ----------------------------------------
      - name: Build C engine (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          make clean && make
          cp build/octopus dist/

      # MSYS2 ucrt64 gcc is preinstalled on windows runners at C:\msys64;
      # build_win.ps1 auto-detects it.
      - name: Build C engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          powershell -ExecutionPolicy Bypass -File build_win.ps1 -Clean
          Copy-Item build\octopus.exe dist\

      # ----- Rust hosts (in-process engine; rebuilds liboctopus.a via build.rs)
      - name: Build Rust binaries (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          cp target/release/octopus_gui target/release/octopus_cli dist/

      - name: Build Rust binaries (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --release --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release/octopus_gui.exe target/x86_64-pc-windows-gnu/release/octopus_cli.exe dist/
        shell: bash

      - name: Stage dist (Linux)
        if: runner.os == 'Linux'
        run: |
          cp web_gui.html web_gui_modern.html dist/
          strip dist/octopus dist/octopus_gui dist/octopus_cli

      - name: Stage dist (Windows)
        if: runner.os == 'Windows'
        run: cp web_gui.html web_gui_modern.html dist/
        shell: bash

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Publish a GitHub Release for every successful build.
  #    - Push to main  → prerelease tagged dev-<short_sha>
  #    - v* tag push    → stable release tagged <version>, marked "latest"
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Stage release assets
        run: |
          mkdir -p release
          (cd artifacts/octopus-linux-x64   && zip -r "$GITHUB_WORKSPACE/release/octopus-linux-x64.zip" .)
          (cd artifacts/octopus-windows-x64 && zip -r "$GITHUB_WORKSPACE/release/octopus-windows-x64.zip" .)

      - name: Set release metadata
        id: meta
        env:
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          short="${SHA:0:7}"
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "tag=${REF#refs/tags/}"    >> "$GITHUB_OUTPUT"
            echo "name=${REF#refs/tags/}"   >> "$GITHUB_OUTPUT"
            echo "prerelease=false"         >> "$GITHUB_OUTPUT"
            echo "make_latest=true"         >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-${short}"         >> "$GITHUB_OUTPUT"
            echo "name=Dev ${short}"        >> "$GITHUB_OUTPUT"
            echo "prerelease=true"          >> "$GITHUB_OUTPUT"
            echo "make_latest=false"        >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
